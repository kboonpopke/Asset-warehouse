<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no">

  <title>Asset Warehouse</title>

  <link
    rel="stylesheet"
    href="style.css">

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

</head>


<body>

<div class="app">


  <!-- HEADER -->

  <div style="margin-bottom:18px;">

    <h1 style="margin-bottom:4px;">
      Asset Warehouse
    </h1>

    <div class="sub">
      QR Asset Management
    </div>

  </div>



  <!-- SCANNER -->

  <div class="card">

    <button
      id="openBtn"
      class="primary"
      onclick="openScanner()">

      📷 สแกน Asset QR

    </button>


    <button
      id="closeBtn"
      class="danger hidden"
      onclick="closeScanner()">

      ✕ ปิดกล้อง

    </button>


    <div
      id="readerBox"
      class="hidden">

      <div
        style="
          text-align:center;
          margin:10px 0;
          font-weight:bold;
        ">

        นำ QR Asset Tag เข้าในกรอบ

      </div>


      <div id="reader"></div>

    </div>

  </div>



  <!-- RESULT -->

  <div class="card">

    <h2>
      ข้อมูล Asset
    </h2>


    <div
      id="result"
      class="result">

      <div
        style="
          padding:25px 10px;
          text-align:center;
        ">

        <div
          style="
            font-size:50px;
            margin-bottom:15px;
          ">
          ▦
        </div>


        <div
          style="
            font-size:20px;
            font-weight:bold;
          ">

          พร้อมสแกน Asset Tag

        </div>


        <div
          style="
            color:#6b7680;
            font-size:14px;
            margin-top:8px;
          ">

          กดปุ่มด้านบนแล้วสแกน QR

        </div>

      </div>

    </div>

  </div>



  <!-- ASSET TAG -->

  <div class="card">

    <label>
      Asset Tag
    </label>


    <input
      id="assetTag"
      type="text"
      placeholder="ค่าจาก QR จะมาอยู่ตรงนี้"
      readonly>

  </div>


</div>



<!-- สำคัญ: save.js ต้องมาก่อน -->

<script src="save.js"></script>

<script src="script.js"></script>


</body>

</html>
