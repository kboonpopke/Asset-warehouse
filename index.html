<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Asset Warehouse</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Asset Warehouse</h1>
      <div class="subtitle">QR Asset Management</div>
    </div>
    <button class="outline" onclick="showDashboard()">📊 Dashboard</button>
  </header>

  <section class="card">
    <label>👤 ผู้ทำรายการ</label>
    <input id="operator" placeholder="ชื่อผู้ทำรายการ" autocomplete="off">
  </section>

  <section class="card">
    <div class="menu">
      <button class="menu-btn main" onclick="openScanner('LOOKUP')">📷<span>สแกน Asset</span></button>
      <button class="menu-btn" onclick="showNewAsset()">➕<span>รับ Asset ใหม่</span></button>
      <button class="menu-btn" onclick="openScanner('ISSUE')">📤<span>เบิก / จ่าย</span></button>
      <button class="menu-btn" onclick="openScanner('RETURN')">📥<span>คืน Asset</span></button>
      <button class="menu-btn" onclick="openScanner('MOVE')">🔄<span>ย้าย Location</span></button>
      <button class="menu-btn" onclick="openScanner('REPAIR_OUT')">🔧<span>ส่งซ่อม</span></button>
      <button class="menu-btn" onclick="showAuditStart()">📋<span>ตรวจนับ</span></button>
      <button class="menu-btn" onclick="showSearch()">🔎<span>ค้นหา</span></button>
    </div>
  </section>

  <section id="scannerCard" class="card hidden">
    <div class="scanner-header">
      <div>
        <b id="scannerTitle">สแกน Asset</b>
        <small>นำ QR Asset Tag เข้าในกรอบ</small>
      </div>
      <button class="danger" onclick="closeScanner()">✕ ปิด</button>
    </div>
    <div id="reader"></div>
  </section>

  <section class="card">
    <label>Asset Tag</label>
    <div class="input-action">
      <input id="assetTag" placeholder="พิมพ์ Asset Tag หรือยิงด้วย PDA" autocomplete="off">
      <button class="primary" onclick="manualScan()">ค้นหา</button>
    </div>
  </section>

  <main id="content" class="card">
    <div class="empty">
      <div class="empty-icon">▦</div>
      <b>พร้อมใช้งาน</b>
      <span>เลือกเมนูหรือสแกน QR Asset</span>
    </div>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="save.js"></script>
<script src="script.js"></script>
</body>
</html>
